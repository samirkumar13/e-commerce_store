<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qurion Tech</title>
  <script>
    // Instant branding: apply cached settings before React starts (no flash)
    (function () {
      try {
        const cached = localStorage.getItem('storeSettings');
        if (!cached) return;
        const s = JSON.parse(cached);
        const root = document.documentElement;

        if (s.storeName) document.title = s.storeName;
        if (s.storeFavicon) {
          let link = document.querySelector("link[rel~='icon']");
          if (!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
          link.href = s.storeFavicon;
        }

        // Theme colors
        if (s.primaryColor) root.style.setProperty('--color-primary', s.primaryColor);
        if (s.primaryFocusColor) root.style.setProperty('--color-primary-focus', s.primaryFocusColor);
        if (s.backgroundColor) {
          root.style.setProperty('--color-bg', s.backgroundColor);
          document.body.style.backgroundColor = s.backgroundColor;
        }
        if (s.primaryGlow) root.style.setProperty('--shadow-glow', s.primaryGlow);

        // Font family
        if (s.fontFamily && s.fontFamily !== 'Inter') {
          const link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(s.fontFamily) + ':wght@400;500;600;700;800&display=swap';
          document.head.appendChild(link);
          root.style.setProperty('--font-sans', s.fontFamily);
        }

        // Border radius
        if (s.borderRadius) root.style.setProperty('--radius-btn', s.borderRadius);
      } catch (e) { }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['var(--font-sans,Inter)', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            'primary': 'var(--color-primary, #06b6d4)',
            'primary-focus': 'var(--color-primary-focus, #0891b2)',
            'slate-50': '#f8fafc',
            'slate-100': '#f1f5f9',
            'slate-200': '#e2e8f0',
            'slate-300': '#cbd5e1',
            'slate-400': '#94a3b8',
            'slate-500': '#64748b',
            'slate-600': '#475569',
            'slate-700': '#334155',
            'slate-800': '#1e293b',
            'slate-900': '#0f172a',
          },
          boxShadow: {
            'soft': '0 1px 2px rgba(15,23,42,0.04), 0 6px 16px -6px rgba(15,23,42,0.08)',
            'soft-lg': '0 4px 28px -8px rgba(15,23,42,0.14)',
            'glow': 'var(--shadow-glow, 0 8px 24px -10px rgba(6,182,212,0.65))',
          },
          keyframes: {
            'fade-in-up': {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            'toast-in': {
              '0%': { opacity: '0', transform: 'translateY(12px) scale(.98)' },
              '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
            },
            'modal-in': {
              '0%': { opacity: '0', transform: 'translateY(8px) scale(.98)' },
              '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
            },
          },
          animation: {
            'fade-in-up': 'fade-in-up 0.5s ease-out forwards',
            'toast-in': 'toast-in .28s cubic-bezier(.21,1.02,.73,1) forwards',
            'modal-in': 'modal-in .2s ease-out forwards',
          },
        }
      }
    }
  </script>
  <style>
